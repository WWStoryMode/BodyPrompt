services:
  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      # Per-model routing. A URL is a worker; "fixture" (or unset) is the hand-authored
      # stub. Local and remote workers are configured identically — a container on this
      # machine and a GPU somewhere else differ by the URL and nothing else, so moving a
      # model off this box is a change to this line, not to any code.
      #
      #   BODYPROMPT_MODEL_SNAPMOGEN=https://gpu.example.com/snapmogen
      #   BODYPROMPT_MODEL_SNAPMOGEN_TOKEN=…       # remote only
      #   BODYPROMPT_MODEL_SNAPMOGEN_HOSTING=local # override the local/remote guess
      BODYPROMPT_MODEL_KIMODO: ${BODYPROMPT_MODEL_KIMODO:-}
      BODYPROMPT_MODEL_SNAPMOGEN: ${BODYPROMPT_MODEL_SNAPMOGEN:-fixture}
      BODYPROMPT_MODEL_LANGUAGE_OF_MOTION: ${BODYPROMPT_MODEL_LANGUAGE_OF_MOTION:-fixture}
      # Legacy, still honoured: BODYPROMPT_BACKEND=kimodo is translated into
      # BODYPROMPT_MODEL_KIMODO when that is not set, so every existing command,
      # .env and document keeps working.
      BODYPROMPT_BACKEND: ${BODYPROMPT_BACKEND:-stub}
      BODYPROMPT_KIMODO_URL: http://kimodo-worker:8010
    ports:
      - "8000:8000"

  kimodo-worker:
    profiles: ["local-gpu"]
    build:
      # inference/, so the shared canonical package is inside the build context.
      context: ./inference
      dockerfile: kimodo-worker/Dockerfile
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # Model loading prints to stdout, which Python buffers when it is not a terminal.
      # Without this the first sign of life is minutes of silence.
      PYTHONUNBUFFERED: "1"
      TEXT_ENCODER_DEVICE: cpu
      # "local" loads the LLM2Vec encoder in this container; "api" points at a
      # `kimodo_textencoder` server elsewhere via TEXT_ENCODER_URL. Either way it is the
      # same encoder — the embeddings Kimodo was trained on — only its host changes.
      TEXT_ENCODER_MODE: ${TEXT_ENCODER_MODE:-local}
      TEXT_ENCODER_URL: ${TEXT_ENCODER_URL:-}
      BODYPROMPT_DIFFUSION_STEPS: ${BODYPROMPT_DIFFUSION_STEPS:-100}
      # Where Kimodo's text-embedding cache lives. Spelled exactly as its code reads it —
      # the lowercase prefix is Kimodo's, not a typo. Given a volume below so a re-run of a
      # phrase skips the CPU encode even after a restart.
      kimodo_EMBED_CACHE_DIR: /root/.cache/kimodo/embeddings
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - embedding-cache:/root/.cache/kimodo/embeddings
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Not real yet: the adapter, the contract and the length rules are built and tested, but
  # the checkpoints are not wired up. Left out of the local-gpu profile on purpose, so
  # nobody starts it expecting motion. See docs/v3-models.md.
  snapmogen-worker:
    profiles: ["snapmogen"]
    build:
      context: ./inference
      dockerfile: snapmogen-worker/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Weights and the 5 KB of dataset statistics, mounted rather than baked — large, and
      # under Snap Inc.'s non-commercial licence.
      - ./inference/snapmogen-worker/checkpoints:/checkpoints:ro
      - ./inference/snapmogen-worker/meta:/meta:ro
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
  embedding-cache:
