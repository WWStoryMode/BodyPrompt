[project]
name = "bodyprompt-kimodo-worker"
version = "0.1.0"
description = "Local Kimodo inference and SOMA-to-BodyPrompt canonical adapter."
requires-python = ">=3.10,<3.12"
dependencies = [
    "bodyprompt-motion",
    "fastapi>=0.110",
    "numpy>=1.26",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
]

[tool.uv]
default-groups = ["dev"]

# The canonical skeleton and the model-independent half of adapting to it, shared with the
# other workers. A path dependency rather than a copy: drift here does not crash, it
# returns a plausible-looking body with false anatomy.
[tool.uv.sources]
bodyprompt-motion = { path = "../common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
