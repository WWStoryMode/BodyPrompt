[project]
name = "bodyprompt-kimodo-worker"
version = "0.1.0"
description = "Local Kimodo inference and SOMA-to-BodyPrompt canonical adapter."
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
